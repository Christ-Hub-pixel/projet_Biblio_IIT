name: CI BiblioIIT

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Vérifier le style (Ruff)
        run: ruff check .

      - name: Vérifier la syntaxe Python
        run: python -m py_compile regles.py modeles.py depot_sqlite.py service.py console.py
